<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>oigaffer sandbox</title>
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; background: #102c1c; color: #eef1e6; font: 14px system-ui, sans-serif; }
      a { color: inherit; }
      canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
      .fill { height: 100%; }
      .readout { position: fixed; bottom: 8px; left: 12px; margin: 0; }
      .back { position: fixed; top: 8px; left: 12px; }
      .views { padding: 24px; }
      .shooting { height: 100%; display: flex; flex-direction: column; }
      .split { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
      .split section { position: relative; min-height: 0; }
      .split h2 { position: absolute; top: 8px; right: 12px; margin: 0; font-size: 13px; font-weight: 500; opacity: 0.8; pointer-events: none; }
      .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 10px 12px; }
      .controls label { display: flex; align-items: center; gap: 6px; }
      .controls p { margin: 0; }
      @media (max-width: 800px) { .split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
